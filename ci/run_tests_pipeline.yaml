trigger: none

variables:
  # Supplies GIT_GITHUB_TOKEN, which templates/clone_questdb.yaml hands to gh so
  # its questdb clone and submodule fetch do not go out to github.com
  # anonymously -- see that file. Only the vsQuestDbMaster leg uses it; the
  # other jobs run no git of their own.
  - group: github-public-read
  # Defaults for the matrix legs that pin no Arrow producers. A variable group
  # requires the list form, so these are spelled as name/value pairs.
  - name: pyarrowVersion
    value: ""
  - name: polarsVersion
    value: ""
  - name: arrowProducerPins
    value: ""

stages:
  - stage: BuildAndTest
    displayName: "Building and testing"
    jobs:
      - job: RunOn
        displayName: "on"
        strategy:
          matrix:
            linux-pandas3:
              imageName: "ubuntu-latest"
              poolName: "Azure Pipelines"
              pythonVersion: "3.12"
              questdbVersion: ""
              requireQwpRowTypes: ""
              buildDocs: true
              runClaimGrid: true
            linux-pandas2:
              imageName: "ubuntu-latest"
              poolName: "Azure Pipelines"
              pythonVersion: "3.12"
              pandasVersion: "2.3.3"
              pyarrowVersion: "25.0.1"
              polarsVersion: "1.44.1"
              arrowProducerPins: "pandas=2.3.3,pyarrow=25.0.1,polars=1.44.1"
              questdbVersion: ""
              requireQwpRowTypes: ""
            linux-pandas310:
              imageName: "ubuntu-latest"
              poolName: "Azure Pipelines"
              pythonVersion: "3.10"
              pandasVersion: "2.3.3"
              questdbVersion: ""
              requireQwpRowTypes: ""
            linux-min-deps:
              # The oldest dependency versions that the docs promise
              # (see MIN_VERSIONS in ci/pip_install_deps.py).
              imageName: "ubuntu-latest"
              poolName: "Azure Pipelines"
              pythonVersion: "3.10"
              minDeps: true
              questdbVersion: ""
              requireQwpRowTypes: ""
            linux-qdb-master:
              imageName: "ubuntu-latest"
              poolName: "Azure Pipelines"
              pythonVersion: "3.12"
              vsQuestDbMaster: true
              questdbVersion: ""
              requireQwpRowTypes: ""
            # The QWP-only column types are supported from QuestDB 10,
            # the first production QWP. The three legs that pin no
            # version run the 9.4.3 beta and skip them;
            # `linux-qdb-master` builds from the repo, which is past 10,
            # and runs them. Every test that writes one of these types
            # lives in a class whose `setUp` asks for
            # `FIRST_QWP_ROW_TYPES_RELEASE`, so the skip covers the
            # whole class rather than the calls somebody remembered to
            # write, and a test.py meta-test reads both test files and
            # fails on a test that writes one from a class with no gate.
            # This leg pins a 10 release and sets requireQwpRowTypes,
            # which turns those skips into failures: otherwise a run
            # covering none of it looks exactly like a run that passed.
            linux-qdb10:
              imageName: "ubuntu-latest"
              poolName: "Azure Pipelines"
              pythonVersion: "3.12"
              questdbVersion: "10.0.0"
              requireQwpRowTypes: "1"
            mac:
              imageName: "macos-latest"
              poolName: "Azure Pipelines"
              pythonVersion: "3.12"
              questdbVersion: ""
              requireQwpRowTypes: ""
            windows-msvc-2022:
              imageName: "windows-2025"
              poolName: "Azure Pipelines"
              pythonVersion: "3.12"
              questdbVersion: ""
              requireQwpRowTypes: ""
        pool:
          name: $(poolName)
          vmImage: $(imageName)
        timeoutInMinutes: 90
        steps:
          - checkout: self
            fetchDepth: 1
            lfs: false
            submodules: true
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"
          - script: |
              python3 --version
              python3 -m pip install cython
            displayName: "Install cython"
          - script: >-
              python3 ci/pip_install_deps.py
              --pyarrow-version=$(pyarrowVersion)
              --polars-version=$(polarsVersion)
              --with-duckdb
            displayName: "Install pandas 3.x"
            condition: and(eq(variables.pandasVersion, ''), ne(variables.minDeps, true))
          - script: >-
              python3 ci/pip_install_deps.py
              --pandas-version=$(pandasVersion)
              --pyarrow-version=$(pyarrowVersion)
              --polars-version=$(polarsVersion)
              --with-duckdb
            displayName: "Install pandas $(pandasVersion)"
            condition: ne(variables.pandasVersion, '')
          - script: python3 ci/pip_install_deps.py --min-versions --with-duckdb
            displayName: "Install minimum dependency versions"
            condition: eq(variables.minDeps, true)
          - script: python3 proj.py build
            displayName: "Build"
          # `proj.py doc` runs Sphinx with `-nW`, so an unresolvable
          # reference in a docstring fails here. Read the Docs builds
          # without it and renders the dangling reference instead, so
          # without this step nothing catches one: the build was left
          # broken twice during review, once by a private-alias
          # annotation and once by an unqualified `:class:` target.
          - script: |
              python3 -m pip install -r docs/requirements.txt
              python3 proj.py doc
            displayName: "Build docs"
            condition: eq(variables.buildDocs, true)
          - template: templates/clone_questdb.yaml
            parameters:
              condition: eq(variables.vsQuestDbMaster, true)
          - bash: |
              set -euo pipefail
              JDK_HOME="${JAVA_HOME_25_X64:-}"
              if [ -z "$JDK_HOME" ] || [ ! -x "$JDK_HOME/bin/javac" ]; then
                JDK_HOME="/opt/jdk25"
                sudo mkdir -p "$JDK_HOME"
                curl -fsSL "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse" |
                  sudo tar -xz -C "$JDK_HOME" --strip-components=1
              fi
              # Azure parses ##vso logging commands on both stdout and stderr.
              # Keep xtrace off here so bash never emits a quoted stderr copy.
              set +x
              echo "##vso[task.setvariable variable=JAVA_HOME]$JDK_HOME"
              echo "##vso[task.prependpath]$JDK_HOME/bin"
            displayName: "Resolve JDK 25"
            condition: eq(variables.vsQuestDbMaster, true)
          # jdkVersionOption tops out at 21 and crashes the task on JDK 25
          # ("Cannot read properties of null (reading 'major')"), so point the
          # task at the JDK resolved above instead of naming a version.
          # $(CLIENT_PROFILE) is set by templates/clone_questdb.yaml.
          - task: Maven@3
            displayName: "Compile QuestDB master"
            inputs:
              mavenPOMFile: "questdb/pom.xml"
              javaHomeOption: "Path"
              jdkDirectory: "$(JAVA_HOME)"
              options: "-DskipTests -Pbuild-web-console$(CLIENT_PROFILE)"
            condition: eq(variables.vsQuestDbMaster, true)
          # The claim grid is 630 cells against an in-process mock and
          # runs in one process, so it is cheap enough to gate on. The
          # re-entrancy grid is a subprocess per cell and stays nightly
          # (`.github/workflows/grids.yml`).
          #
          # Gated because the meta-tests in `test.py` read the
          # checked-in table rather than running it, so on their own
          # they pass against a stale one: a change that alters what a
          # claim does would otherwise reach the default branch and
          # surface the next morning.
          - script: python3 proj.py grid claim
            displayName: "Claim grid"
            condition: eq(variables.runClaimGrid, true)
          - script: python3 proj.py test 1
            displayName: "Test vs released"
            env:
              JAVA_HOME: $(JAVA_HOME_25_X64)
              QDB_VERSION: $(questdbVersion)
              TEST_QUESTDB_REQUIRE_QWP_ROW_TYPES: $(requireQwpRowTypes)
              TEST_QUESTDB_ARROW_PRODUCER_PINS: $(arrowProducerPins)
          - script: python3 proj.py test 1
            displayName: "Test vs master"
            env:
              JAVA_HOME: $(JAVA_HOME)
              QDB_REPO_PATH: "./questdb"
              # QuestDB master runs as the io.questdb JPMS module and needs these
              # JDK 25 access flags (mirrors questdb.sh). The test fixture launches
              # questdb.jar directly rather than via questdb.sh, so feed them to the
              # java launcher through JDK_JAVA_OPTIONS. The fixture already passes
              # --add-exports itself; repeating it here is harmless and keeps the
              # set matching questdb.sh.
              JDK_JAVA_OPTIONS: >-
                --sun-misc-unsafe-memory-access=allow
                --enable-native-access=io.questdb
                --add-opens=java.base/java.lang=io.questdb
                --add-opens=java.base/java.lang.reflect=io.questdb
                --add-opens=java.base/java.nio=io.questdb
                --add-opens=java.base/java.time.zone=io.questdb
                --add-exports=java.base/jdk.internal.vm=io.questdb
              TEST_QUESTDB_REQUIRE_QWP_ROW_TYPES: "1"
            condition: eq(variables.vsQuestDbMaster, true)
      - job: OidcLegacyPgAdapters
        displayName: "OIDC: SQLAlchemy 1.4 and psycopg2 only"
        pool:
          name: "Azure Pipelines"
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 45
        steps:
          - checkout: self
            fetchDepth: 1
            lfs: false
            submodules: true
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.10"
          - script: python3 -m pip install 'cython>=3.1.2'
            displayName: "Install Cython"
          - script: python3 ci/pip_install_deps.py
            displayName: "Install build/test dependencies"
          - script: |
              python3 -m pip uninstall -y psycopg psycopg-binary
              python3 -m pip install 'sqlalchemy>=1.4,<2' psycopg2-binary
              python3 -c "import importlib.util, sqlalchemy, psycopg2; assert sqlalchemy.__version__.startswith('1.4.'); assert importlib.util.find_spec('psycopg') is None"
            displayName: "Select and verify the psycopg2-only stack"
          - script: python3 proj.py build
            displayName: "Build"
          # `proj.py build` leaves the extension in place under src/, which is
          # not on sys.path; `proj.py test` sets this for the other jobs (see
          # test/patch_path.py).
          - script: python3 test/test.py -v AdapterTest AdapterRealDriverTest
            displayName: "Test real legacy PG-wire adapters"
            env:
              TEST_QUESTDB_PATCH_PATH: "1"
      - job: TestsAgainstVariousNumpyVersion1x
        pool:
          name: "Azure Pipelines"
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 90
        steps:
          - checkout: self
            fetchDepth: 1
            lfs: false
            submodules: true
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.10"
          - script: |
              python3 --version
              python3 -m pip install uv
              sudo apt-get install -y libopenblas-dev pkg-config
            displayName: "Install uv"
          - script: uv run --python python --with 'numpy==1.21.0' test/test.py -v TestBufferProtocolVersionV2 TestNumpyDecoderCompatibility
            displayName: "Test vs numpy 1.21"
          - script: uv run --python python --with 'numpy==1.24.0' test/test.py -v TestBufferProtocolVersionV2 TestNumpyDecoderCompatibility
            displayName: "Test vs numpy 1.24"
          - script: uv run --python python --with 'numpy==1.26.0' test/test.py -v TestBufferProtocolVersionV2 TestNumpyDecoderCompatibility
            displayName: "Test vs numpy 1.26"
      - job: TestsAgainstVariousNumpyVersion2x
        pool:
          name: "Azure Pipelines"
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 90
        steps:
          - checkout: self
            fetchDepth: 1
            lfs: false
            submodules: true
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.11"
          - script: |
              python3 --version
              python3 -m pip install uv
              sudo apt-get install -y libopenblas-dev pkg-config
            displayName: "Install uv"
          - script: uv run --python python --with 'numpy==2.0.0' test/test.py -v TestBufferProtocolVersionV2 TestNumpyDecoderCompatibility
            displayName: "Test vs numpy 2.0"
          - script: uv run --python python --with 'numpy==2.2.0' test/test.py -v TestBufferProtocolVersionV2 TestNumpyDecoderCompatibility
            displayName: "Test vs numpy 2.2"
          - script: uv run --python python --with 'numpy==2.3.0' test/test.py -v TestBufferProtocolVersionV2 TestNumpyDecoderCompatibility
            displayName: "Test vs numpy 2.3"
