trigger: none

stages:
  - stage: BuildAndTest
    displayName: "Building and testing"
    jobs:
      - job: RunOn
        displayName: "on"
        strategy:
          matrix:
            linux-pandas3:
              imageName: "ubuntu-latest"
              poolName: "Azure Pipelines"
              pythonVersion: "3.12"
            linux-pandas2:
              imageName: "ubuntu-latest"
              poolName: "Azure Pipelines"
              pythonVersion: "3.12"
              pandasVersion: "2.3.3"
            linux-pandas310:
              imageName: "ubuntu-latest"
              poolName: "Azure Pipelines"
              pythonVersion: "3.10"
              pandasVersion: "2.3.3"
            linux-qdb-master:
              imageName: "ubuntu-latest"
              poolName: "Azure Pipelines"
              pythonVersion: "3.12"
              vsQuestDbMaster: true
            mac:
              imageName: "macos-latest"
              poolName: "Azure Pipelines"
              pythonVersion: "3.12"
            windows-msvc-2022:
              imageName: "windows-2025"
              poolName: "Azure Pipelines"
              pythonVersion: "3.12"
        pool:
          name: $(poolName)
          vmImage: $(imageName)
        timeoutInMinutes: 90
        steps:
          - checkout: self
            fetchDepth: 1
            lfs: false
            submodules: true
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"
          - script: |
              python3 --version
              python3 -m pip install cython
            displayName: "Install cython"
          - script: python3 ci/pip_install_deps.py
            displayName: "Install pandas 3.x"
            condition: eq(variables.pandasVersion, '')
          - script: python3 ci/pip_install_deps.py --pandas-version==$(pandasVersion)
            displayName: "Install pandas $(pandasVersion)"
            condition: ne(variables.pandasVersion, '')
          - script: python3 proj.py build
            displayName: "Build"
          # Pull the nightly image (built from QuestDB master by QuestDB's own
          # release pipeline) instead of cloning and compiling QuestDB from
          # source. Compiling master now also builds QuestDB's native Rust qdbr
          # crate (pinned nightly toolchain) and requires JDK 25; the published
          # image already ships all of that, so the `vs master` leg just runs it.
          - script: docker pull questdb/questdb:nightly
            displayName: "Pull QuestDB nightly image"
            condition: eq(variables.vsQuestDbMaster, true)
          - script: python3 proj.py test 1
            displayName: "Test vs released"
            env:
              # The latest QuestDB release requires a JDK 25 runtime (the
              # -no-jre tarball uses the host JDK). JDK 25 is pre-installed on
              # the Microsoft-hosted ubuntu/macOS/windows images as
              # JAVA_HOME_25_X64.
              JAVA_HOME: $(JAVA_HOME_25_X64)
          # QDB_DOCKER_IMAGE makes the integration fixture run QuestDB from the
          # Docker image rather than a locally-built jar (no host JDK needed).
          - script: python3 proj.py test 1
            displayName: "Test vs master (nightly Docker image)"
            env:
              QDB_DOCKER_IMAGE: questdb/questdb:nightly
            condition: eq(variables.vsQuestDbMaster, true)
      - job: TestsAgainstVariousNumpyVersion1x
        pool:
          name: "Azure Pipelines"
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 90
        steps:
          - checkout: self
            fetchDepth: 1
            lfs: false
            submodules: true
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.10"
          - script: |
              python3 --version
              python3 -m pip install uv
              sudo apt-get install -y libopenblas-dev pkg-config
            displayName: "Install uv"
          - script: uv run --python python --with 'numpy==1.21.0' test/test.py -v TestBufferProtocolVersionV2
            displayName: "Test vs numpy 1.21"
          - script: uv run --python python --with 'numpy==1.24.0' test/test.py -v TestBufferProtocolVersionV2
            displayName: "Test vs numpy 1.24"
          - script: uv run --python python --with 'numpy==1.26.0' test/test.py -v TestBufferProtocolVersionV2
            displayName: "Test vs numpy 1.26"
      - job: TestsAgainstVariousNumpyVersion2x
        pool:
          name: "Azure Pipelines"
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 90
        steps:
          - checkout: self
            fetchDepth: 1
            lfs: false
            submodules: true
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.11"
          - script: |
              python3 --version
              python3 -m pip install uv
              sudo apt-get install -y libopenblas-dev pkg-config
            displayName: "Install uv"
          - script: uv run --python python --with 'numpy==2.0.0' test/test.py -v TestBufferProtocolVersionV2
            displayName: "Test vs numpy 2.0"
          - script: uv run --python python --with 'numpy==2.2.0' test/test.py -v TestBufferProtocolVersionV2
            displayName: "Test vs numpy 2.2"
          - script: uv run --python python --with 'numpy==2.3.0' test/test.py -v TestBufferProtocolVersionV2
            displayName: "Test vs numpy 2.3"
