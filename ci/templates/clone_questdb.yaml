# Clone questdb master and decide how the questdb-client jar is supplied.
#
# questdb's build pulls in org.questdb:questdb-client at the version held in
# core/pom.xml's questdb.client.version property. When that version is a
# release (e.g. 1.3.0) the jar is fetched from Maven Central, so a plain
# `git clone` is enough. When it's a -SNAPSHOT (e.g. 1.3.5-SNAPSHOT) the jar
# is published nowhere — it must be built from the java-questdb-client
# submodule via questdb's `local-client` profile. Skipping that step fails
# the questdb build with:
#   Could not find artifact org.questdb:questdb-client:jar:<version>
#
# This mirrors questdb/questdb's ci/templates/detect-local-client.yml: read
# the version, and for a SNAPSHOT check out the submodule and export
# CLIENT_PROFILE=",local-client" so the "Compile QuestDB master" Maven step
# appends the profile (options: "... -Pbuild-web-console$(CLIENT_PROFILE)").
# For a release CLIENT_PROFILE is cleared, leaving the Maven options
# untouched. Reading the version (rather than hard-coding the profile) keeps
# every questdb-building job working whichever way questdb master flips next.
#
# `condition` parameter: this repo only builds questdb on the
# `vsQuestDbMaster` matrix leg, so callers pass that gate down to every step
# in the template (Azure has no `condition` on a `- template:` reference).
parameters:
  - name: condition
    type: string
    default: succeeded()

steps:
  - bash: |
      set -eu
      # The checkout task keeps no credentials (persistCredentials defaults to
      # false), so this clone would reach github.com anonymously, and GitHub
      # throttles anonymous git-over-HTTPS from the agents' shared egress IP
      # with a 401 that git reports as
      #   fatal: could not read Username for 'https://github.com'
      # even though questdb/questdb is public. `gh auth setup-git` registers gh
      # as git's credential helper for github.com; gh reads the token from this
      # step's environment, so the clone authenticates and no token is written
      # to the agent. The helper lands in the global git config, so it also
      # covers the submodule clone in the next step -- which needs GH_TOKEN in
      # its own environment for gh to answer with.
      #
      # Azure leaves an undefined variable as its literal macro text, so drop
      # GH_TOKEN when it is not token-shaped rather than handing gh a
      # "$(GIT_GITHUB_TOKEN)" string to authenticate with.
      [[ ${GH_TOKEN:-} =~ ^[A-Za-z0-9_-]+$ ]] || unset GH_TOKEN
      if [[ -n "${GH_TOKEN:-}" ]] && command -v gh >/dev/null 2>&1; then
        gh auth setup-git --hostname github.com
      else
        echo "No usable token or no gh; cloning anonymously"
      fi
      git clone --depth 1 https://github.com/questdb/questdb.git
    displayName: git clone questdb
    env:
      GH_TOKEN: $(GIT_GITHUB_TOKEN)
    condition: ${{ parameters.condition }}
  - bash: |
      # No `pipefail`: the version extraction is `sed ... | head -1`, and
      # core/pom.xml carries the property on more than one line, so head can
      # close the pipe early and leave sed with SIGPIPE — under pipefail that
      # would fail the step. `set -eu` still aborts on a failed cd / submodule
      # checkout.
      set -eu
      # Same reasoning as the clone step, which registered the credential
      # helper: gh reads the token from here when git invokes it for the
      # submodule fetch, and must never be handed an unexpanded macro.
      [[ ${GH_TOKEN:-} =~ ^[A-Za-z0-9_-]+$ ]] || unset GH_TOKEN
      cd questdb
      CLIENT_VERSION=$(sed -n 's/.*<questdb.client.version>\(.*\)<\/questdb.client.version>.*/\1/p' core/pom.xml | head -1)
      echo "questdb.client.version=$CLIENT_VERSION"
      if echo "$CLIENT_VERSION" | grep -q '\-SNAPSHOT$'; then
        echo "SNAPSHOT client -> build java-questdb-client submodule, activate local-client profile"
        git submodule update --init --depth 1 java-questdb-client
        echo "##vso[task.setvariable variable=CLIENT_PROFILE],local-client"
      else
        echo "Release client -> resolve questdb-client from Maven Central"
        echo "##vso[task.setvariable variable=CLIENT_PROFILE]"
      fi
    displayName: "Detect local client profile"
    env:
      GH_TOKEN: $(GIT_GITHUB_TOKEN)
    condition: ${{ parameters.condition }}
